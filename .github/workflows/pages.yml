name: Publish MeetSimpler website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - '.gitignore'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  queue: max
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the website is still current
        id: revision
        shell: bash
        run: |
          latest_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          git fetch --no-tags --depth=1 origin "$latest_sha"
          checked_out_site="$(git rev-parse HEAD:website)"
          latest_site="$(git rev-parse FETCH_HEAD:website)"
          if [[ "$checked_out_site" == "$latest_site" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment because main contains newer website files."
          fi
      - uses: actions/configure-pages@v5
        if: steps.revision.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.revision.outputs.current == 'true'
        with:
          path: website
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        if: steps.revision.outputs.current == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
