<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    connect-src 'self' https://bwwtoynfpuhtytoxbmol.supabase.co;
    style-src 'self';
    img-src 'self';
    base-uri 'none';
    form-action 'self'
  ">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password - MeetSimpler</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="meetsimpler.png">
</head>
<body>
  <header><a class="brand" href="./"><img class="brand-logo" src="meetsimpler.png" alt="" width="40" height="40"><span>MeetSimpler</span></a><nav aria-label="Main navigation"><a href="./">Home</a></nav></header>
  <main class="account">
    <h1>Choose a new password.</h1>
    <p id="status" role="status" aria-live="polite">Checking your recovery link...</p>
    <section id="reset-form" class="card">
      <form id="reset">
        <label for="password">New password (at least 6 characters)</label>
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
        <button id="save" class="button" disabled>Save new password</button>
      </form>
    </section>
    <section id="result" class="card" hidden aria-labelledby="result-title">
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <h2 id="result-title" tabindex="-1"></h2>
      <p id="result-next" class="result-next"></p>
    </section>
    <p><a id="login-link" class="button" href="account.html">Go to login page</a></p>
    <p><a href="mailto:meetsimpler@gmail.com">Need help?</a></p>
  </main>
  <script type="module" src="reset-password.js"></script>
<script type="module" src="i18n.js"></script></body>
</html>
